[package]
name = "gamechat"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Voice-driven supervisor for Claude Code and Codex coding agents."
license = "MIT"
readme = "README.md"

[[bin]]
name = "gamechat"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
cpal = "0.15"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
